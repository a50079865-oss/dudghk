name: Build EP1 Part 1

# build/part1 브랜치에 푸시하면 돈다. 기본 브랜치를 건드리지 않으려고 push 트리거를 쓴다.
on:
  push:
    branches: [build/part1]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ffmpeg 준비
        run: pip install imageio-ffmpeg

      - name: 주소 목록 준비
        working-directory: projects/firebird/edit
        env:
          MEDIA_URLS: ${{ secrets.MEDIA_URLS }}
          MEDIA_URLS_AUDIO: ${{ secrets.MEDIA_URLS_AUDIO }}
          MEDIA_URLS_PATCH: ${{ secrets.MEDIA_URLS_PATCH }}
        run: |
          if [ -f urls.json ]; then
            echo "저장소의 urls.json 을 쓴다"
          elif [ -n "$MEDIA_URLS" ]; then
            printf '%s' "$MEDIA_URLS" > urls.json
            echo "시크릿에서 urls.json 을 만들었다"
          else
            echo "::error::urls.json 도 MEDIA_URLS 시크릿도 없다"; exit 1
          fi
          # 오디오(스코어·앰비언스)는 별도 시크릿으로 합친다
          if [ -n "$MEDIA_URLS_AUDIO" ]; then
            printf '%s' "$MEDIA_URLS_AUDIO" > urls_audio.json
            python3 -c "import json;a=json.load(open('urls.json'));b=json.load(open('urls_audio.json'));a.update(b);json.dump(a,open('urls.json','w'));print(f'오디오 {len(b)}건 합침')"
          else
            echo "::warning::MEDIA_URLS_AUDIO 가 없다 — 스코어와 앰비언스 없이 빌드한다"
          fi
          # 소재를 고칠 때마다 시크릿 전체를 다시 붙이지 않아도 되게,
          # 덮어쓸 항목만 담은 작은 시크릿을 맨 마지막에 합친다.
          if [ -n "$MEDIA_URLS_PATCH" ]; then
            printf '%s' "$MEDIA_URLS_PATCH" > urls_patch.json
            python3 -c "import json;a=json.load(open('urls.json'));b=json.load(open('urls_patch.json'));a.update(b);json.dump(a,open('urls.json','w'));print(f'덮어쓰기 {len(b)}건 적용: '+', '.join(sorted(b)))"
          fi
          python3 -c "import json;d=json.load(open('urls.json'));print(f'주소 {len(d)}건')"

      - name: 소스 다운로드
        working-directory: projects/firebird/edit
        run: python3 fetch_media.py --urls urls.json --out ./media

      - name: 빌드
        working-directory: projects/firebird/edit
        run: |
          python3 build_part1.py --media ./media --out part1.mp4 \
            --subs ../v2026-09-19/subtitles/EP01_part1.ko.srt
          ls -la part1.mp4

      - name: 자막 구운 판도 하나
        working-directory: projects/firebird/edit
        continue-on-error: true
        run: |
          python3 build_part1.py --media ./media --out part1_burned.mp4 --burn-subs \
            --subs ../v2026-09-19/subtitles/EP01_part1.ko.srt

      - name: 휴대폰용 경량 판
        working-directory: projects/firebird/edit
        run: |
          FF=$(python3 -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          "$FF" -y -i part1_burned.mp4 -vf scale=854:480 \
            -c:v libx264 -preset medium -crf 30 -profile:v main \
            -c:a aac -b:a 96k -movflags +faststart part1_preview.mp4
          ls -lh part1_preview.mp4

      # 빌드 직후 바로 해부한다 — 미디어가 아직 러너에 있으므로
      # 완성본뿐 아니라 베드·스코어 원본까지 잴 수 있다.
      - name: 검수
        run: |
          python3 projects/firebird/edit/qc_part1.py \
            --film projects/firebird/edit/part1.mp4 \
            --stems projects/firebird/edit/media \
            --out projects/firebird/edit/qc

      - name: 검수 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B qc/results
          git add -f projects/firebird/edit/qc
          git commit -m "QC: 실행 ${{ github.run_id }} 측정 결과" || echo "변경 없음"
          git push -f origin qc/results

      # 파일별로 나눠 올린다 — 하나 받으려고 전체를 받지 않아도 되게.
      - uses: actions/upload-artifact@v4
        with:
          name: part1-preview-경량
          path: projects/firebird/edit/part1_preview.mp4
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: part1-자막트랙
          path: projects/firebird/edit/part1.mp4
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: part1-자막구움
          path: projects/firebird/edit/part1_burned.mp4
          retention-days: 14
          if-no-files-found: error
